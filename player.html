<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Vídeo</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:white;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  text-align:center;padding:30px;box-sizing:border-box
}
</style>
</head>
<body>
<div id="msg">Cargando vídeo…</div>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const id = (params.get('v') || '').trim();
  const valid = /^[A-Za-z0-9_-]{6,20}$/.test(id);

  if (!valid) {
    document.getElementById('msg').textContent =
      'No se ha indicado un ID de YouTube válido.';
    return;
  }

  const iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?rel=0&playsinline=1';
  iframe.title = 'Vídeo de YouTube';
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  iframe.allowFullscreen = true;

  document.body.appendChild(iframe);
  document.getElementById('msg').remove();
})();
</script>
</body>
</html>
